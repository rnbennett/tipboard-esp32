dependencies:
  lvgl/lvgl:
    version: "^9"
  # P4 board only
  espressif/esp_lcd_jd9165:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch_gt911:
    version: "*"
  # Pinned to the proven-working versions. esp_wifi_remote 1.6.x renamed the
  # WIFI_RMT_* Kconfig symbols that sdkconfig.defaults sets, which breaks the
  # build until those defaults are migrated — upgrade is a separate task.
  espressif/esp_wifi_remote:
    version: "==1.4.1"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "==2.12.3"
    rules:
      - if: "target in [esp32p4]"
  # CYD board
  atanisoft/esp_lcd_touch_xpt2046:
    version: "*"
    rules:
      - if: "target in [esp32, esp32s3]"
